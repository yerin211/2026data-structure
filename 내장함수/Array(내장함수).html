<!DOCTYPE html>
<html lang="en">

<head>
    <title>Array 내장함수 정리</title>
</head>

<body>
    <div id="div1"></div>
    <script>
        //toString() - 쉼표를 구분자로 해서 문자열로 변환
        var fruits1 = ["Banana", "Orange", "StrawBerry"];
        console.log(fruits1.toString());

        //**********************join() - 특정 문자를 구분자로 해서 문자열로 변환 가능
        console.log(fruits1.join(" | "));

        //join() 응용
        var txt1 = "Banana<br>";
        txt1 += "Orange";
        txt1 += "StrawBerry";
        console.log(txt1);

        document.getElementById("div1").innerHTML = txt1;

        var arr1 = [];
        arr1.push("Banana");
        arr1.push("Orange");
        arr1.push("StrawBerry");
        document.getElementById("div1").innerHTML = arr1.join("<br>")

        //pop() : 배열의 가장 마지막 항목을 제거하여 리터 - Stack 구현
        var fruits2 = ["Banana", "Orange", "StrawBerry"];
        var str = fruits2.pop();
        console.log("pop() : " + str);
        console.log(fruits2);

        //push() : 배열의 가장 마지막에 새로운 항목을 추가 - stack 구현
        fruits2.push("kiwi");
        console.log(fruits2);

        //shift() : 배열의 첫번째 항목을 제거하여 리턴함 - Queue 구현
        var fruits3 = ["Banana", "Orange", "StrawBerry"];
        var str = fruits3.shift();
        console.log("shift() : " + str);
        console.log(fruits3);

        //unshift() : 배열의 첫번째에 새로운 항목을 추가 - Queue 구현
        var fruits4 = ["Banana", "Orange", "StrawBerry"];
        var str = fruits4.unshift("Lemon");
        console.log("unshift() : " + str);
        console.log(fruits4)

        //******중요***** Dequeue : pop(), push(), shift(), unshift()

        fruits4[0] = 'Grape';
        console.log(fruits4);

        fruits4[fruits4.length - 1] = "Peach";
        console.log(fruits4);

        //***************************splice(a,b,c)******************************: 배열의 중간에 삽입 또는 삭제 가능
        // a = 시작 인덱스(index)
        // b = 삭제할 항목의 수
        // c = 삽입할 항목
        var fruits5 = ["Banana", "Orange", "StrawBerry"];
        fruits5.splice(1, 0, "Lemon", "Kiwi");
        console.log(fruits5);

        //concat() : 두 개의 배열을 하나로 합쳐줌.
        var BTS1 = ["뷔"];
        var BTS2 = ["정국", "RM", "슈가"];
        var BTS = BTS1.concat(BTS2);
        console.log(BTS);

        //slice(a,b) : a부터 b-1까지 항목을 가져옴
        fruits6 = ["Banana", "Orange", "StrawBerry"];
        //var fruits7 = fruits6.slice(1, 2);
        //var fruits7 = fruits6.slice(1, 3);
        var fruits7 = fruits6.slice(1);
        console.log(fruits7);

        //******sort()******* : 정렬(오름차순, 내림차순)
        var fruits8 = ["Banana", "Orange", "StrawBerry", "Lemon", "kiwi"];
        console.log(fruits8.sort());

        var points = [40, 100, 70, 21, 99];
        console.log(points.sort());

        points.sort(function (a, b) {
            if (a > b) { return 1; }
            else if (a < b) { return -1; }
            else { return 0; }
        });
        points.sort(function (a, b) { return a - b });
        console.log(points);

        //reverse() : 반대로
        console.log(points.reverse());

        //******object 정렬**********
        //name,point = 멤버 변수
        var persons = [
            { name: "유재석", point: 78 },
            { name: "김종국", point: 92 },
            { name: "양세찬", point: 76 },
            { name: "하  하", point: 81 }
        ];

        persons.sort(function (a, b) {
            if (a.point > b.point) {
                return 1;
            } else if (a.point < b.point) {
                return -1;
            } else {
                return 0;
            }
        });

        //삼항연산자
        persons.sort(function (a, b) {
            return (a.point > b.point) ? 1 : (a.point < b.point) ? -1 : 0;
        });
        //?가 먼저였넹..

        console.log(persons);

        //**********filter()********* : 조건에 맞는 배열만 리턴
        var persons = [
            { name: "유재석", point: 78, city: "서울" },
            { name: "김종국", point: 92, city: "대구" },
            { name: "양세찬", point: 76, city: "서울" },
            { name: "하  하", point: 81, city: "제주" }
        ];

        // var jejuPersons = [];
        // for (let i = 0; i < persons.length; i++) {
        //     if (persons[i].city == "제주") {
        //         jejuPersons.push(persons[i]);
        //     }
        // }
        // console.log(jejuPersons);

        var jejuPersons = persons.filter(function (person) {
            return (person.city === "제주");
        });
        console.log(jejuPersons);

        //*********reduce()***********
        var arr = [1, 2, 3, 4, 5];
        var total = 0;
        // for (let i = 0; i < arr.length; i++) {
        //     total += arr[i];
        // }
        // console.log(total);

        // for(var a of arr){
        //     total += a; 
        // }
        // console.log(total);

        //acc : accumulator = 누산기
        //cur : currentvalue = 현재값
        total = arr.reduce(function (acc, cur) {
            return acc + cur;
        });
        console.log(total);

        //*****************map()************* : reduce(), filter()와는 다른 형태로 새로운 배열을 생성
        var userList = [
            { firstName: "재석", lastName: "유", email: "yu@gmail.com" },
            { firstName: "종국", lastName: "김", email: "kim@gmail.com" },
            { firstName: "세찬", lastName: "양", email: "yang@gmail.com" },
            { firstName: "석진", lastName: "지", email: "ji@gmail.com" },

        ];
        var newUserList = userList.map(function (obj) {
            return { FullNmae: obj.lastName + obj.firstName, first: obj.firstName, lastName: obj.lastName, sbs: "런닝맨" }
        });

        console.log(newUserList);


    </script>
</body>

</html>
