<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stack - 괄호안에 있는 문자열을 제거</title>
</head>
<body>
    <script>
        function solution(s){
                let answer= "";
                let stack = [];
                for(let x of s){
                    if(x===")"){
                        while(stack.pop()!=="(");
                    }else {
                        stack.push(x);
                    }
                }
                answer = stack.join("");
                return answer;
            }
            let str = "(A(BC)D)EF(G(H)(IJ)K)LM(N)"
            console.log(solution(str));
    </script>
</body>
</html>
