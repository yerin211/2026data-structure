<body>
    <script>
        function solution(str){
            let answer;
            let stack = [];
            let right,left = 0;
            for(let s of str){
                if(+s < 10){
                    stack.push(s);
                }else{
                    right = +stack.pop( )
                    console.log("right",right);
                    left = +stack.pop();
                    console.log("left",left);
                    if(s ==="+"){stack.push(left + right);}
                    else if(s === "-"){stack.push(left- right);}
                    else if(s === "*"){stack.push(left * right);}
                    else if(s === "/"){stack.push(left / right);}

                }
            }
            answer = stack.pop();
            return answer;
        }
