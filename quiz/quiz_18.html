<html>

<head>
    <title>그래프 경로탐색 - 인접리스트</title>
</head>

<body>
    <script>
        function solution(n, arr) {
            let answer = 0;
            let path = [];
            let index = Array.from({ length: n + 1 }, () => Array());
            let visited = Array.from({ length: n + 1 }, () => 0);

            for (let [a, b] of arr) {
                index[a].push(b);
            }

            function DFS(v) {
                if (v === n) {
                    answer++;
                    console.log(path);
                } else {
                    for (let i = 0; i < index[v].length; i++) {
                        if (index[v][i] === 0) {
                            visited(index[v][i]) = 1;
                            path.push(index[v][i]);
                            DFS(index[v][i]);
                            visited(index[v][i]) = 0;
                            path.pop(index[v][i]);
                        }
                    }
                }
            }
            path.push();
            visited[1] = 1;
            DFS(1);

            return answer;
        }
        let arr = [[1, 2], [1, 3], [1, 4], [2, 1], [2, 3], [2, 5], [3, 4], [4, 2], [4, 5]];
        console.log(solution(5, arr));
    </script>
</body>

</html>
