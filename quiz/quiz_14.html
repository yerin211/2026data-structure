<html>

<head>
    <title>이진트리의 운행 방법 - 부분 집합 구하기</title>
</head>

<body>
    <script>
        function solution(n) {
            let answer = "";

            let size = 1;
            for (let i = 1; i <= n; i++) {
                size *= 2;
            }

            function DFS(n, size) {

                let number = 1;
                if (number >= n) return;
                else {
                    console.log(number);
                    DFS(number * 2);
                    DFS(number * 2 + 1);
                }

            }// function

            DFS(n, size);
            return answer;
        }

        console.log(solution(3));
    </script>
</body>

</html>
