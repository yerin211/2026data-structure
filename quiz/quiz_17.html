<html>

<head>
    <title>그래프 경로 탐색 - 인접 행렬</title>
</head>

<body>
    <script>
        function solution(n, arr) {
            let answer = 0;
            let injub = Array.from(Array(n + 1), () => Array(n + 1).fill(0));
            console.log(injub);
            let path = [];
            let visited = Array.from({ length: n + 1 }, () => 0);

            for (let [a, b] of arr) {
                injub[a][b] = 1;
                console.log(path);
            }

            function DFS(v) {
                if (v === n) {   //기저조건
                    answer++;
                    console.log(path);
                } else {  //재귀호출
                    for (let i = 1; i <= n; i++) {
                        if (injub[v][i] === 1 && visited[i] === 0) {
                            path.push(i);
                            visited[i] = 1;
                            DFS(i);
                            path.pop();
                            visited[i] = 0;
                        }
                    }
                }
            }

            path.push(1);
            visited[1] = 1;
            DFS(1);


            return answer;
        }
        let arr = [[1, 2], [1, 3], [1, 4], [2, 1], [2, 3], [2, 5], [3, 4], [4, 2], [4, 5]];
        console.log(solution(5, arr));
    </script>
</body>

</html>
